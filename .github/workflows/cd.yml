# CD: образ в GHCR → деплой на главный узел по SSH.
#
#   1. build-and-push (github-hosted) собирает образ и пушит в ghcr.io
#      с тегами :latest и :<sha коммита>.
#   2. deploy (github-hosted) заходит по SSH на сервер ключом из секрета
#      SSH_KEY. На сервере ключ ограничен принудительной командой
#      (authorized_keys: command="/root/scripts/hh-pars/deploy.sh",restrict):
#      shell он не даёт, сервер выполняет только свой deploy.sh, а строка
#      script ниже — его аргументы. deploy.sh проверяет, что образ из
#      ghcr.io/ggwolst/hh-pars, логинится в GHCR переданным токеном (живёт,
#      пока идёт запуск), делает pull и up -d только для сервиса bot.
#
# Включение — переменная репозитория DEPLOY_ENABLED=true и секреты
# SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY, SSH_FINGERPRINT (SHA256 ключа сервера).
# Без них деплой пропускается, образ всё равно собирается.

name: CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io требует lowercase имя образа, а github.repository сохраняет
      # регистр владельца (GGWoLst/hh-pars) — приводим отдельным шагом.
      - name: Set lowercase image name
        id: image
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: deploy ${{ needs.build-and-push.outputs.image }}:${{ github.sha }} ${{ github.actor }} ${{ secrets.GITHUB_TOKEN }}
